services:

  order-db:
    image: mongo:latest
    container_name: order-db
    restart: always
    networks:
      - orchestrator-saga
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=123456
    ports:
      - 27017:27017
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-db:
    container_name: product-db
    image: postgres:latest
    environment:
      POSTGRES_DB: product-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /data/postgres
    networks:
      - orchestrator-saga
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-db:
    container_name: payment-db
    image: postgres:latest
    environment:
      POSTGRES_DB: payment-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /data/postgres
    networks:
      - orchestrator-saga
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-db:
    container_name: inventory-db
    image: postgres:latest
    environment:
      POSTGRES_DB: inventory-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /data/postgres
    networks:
      - orchestrator-saga
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    container_name: kafka
    image: obsidiandynamics/kafka
    restart: "no"
    ports:
      - "2181:2181"
      - "9092:9092"
    networks:
      - orchestrator-saga
    environment:
      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT: "6000"
      KAFKA_RESTART_ATTEMPTS: "10"
      KAFKA_RESTART_DELAY: "5"
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: "0"
    volumes:
      - ./data/kafka/data:/var/lib/kafka/data


  redpanda-console:
    container_name: redpanda
    image: docker.redpanda.com/redpandadata/console:v2.3.8
    restart: on-failure
    entrypoint: /bin/sh
    command: -c "echo \"$$CONSOLE_CONFIG_FILE\" > /tmp/config.yml; /app/console"
    ports:
      - "8081:8080"
    networks:
      - orchestrator-saga
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["kafka:29092"]
    depends_on:
      - "kafka"

  order-service:
    #container_name: order-service
    build: '../order-service'
    depends_on:
      kafka:
        condition: service_started
      order-db:
        condition: service_healthy
    networks:
      - orchestrator-saga
    environment:
      - KAFKA_BROKER=kafka:29092
      - MONGO_URI=mongodb://admin:123456@order-db:27017/admin
    #ports:
     # - "3000:3000"
    expose:
      - "3000"
    deploy:
      replicas: 3

  orchestrator-service:
    container_name: orchestrator-service
    build: '../orchestrator-service'
    depends_on:
      kafka:
        condition: service_started
    networks:
      - orchestrator-saga
    environment:
      - KAFKA_BROKER=kafka:29092
    ports:
      - "8080:8080"

  product-service:
    container_name: product-service
    build: '../product-service'
    depends_on:
      kafka:
        condition: service_started
      product-db:
        condition: service_healthy
    networks:
      - orchestrator-saga
    environment:
      - KAFKA_BROKER=kafka:29092
      - DB_HOST=product-db
      - DB_PORT=5432
      - DB_NAME=product-db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    ports:
      - "8090:8090"

  payment-service:
    container_name: payment-service
    build: '../payment-service'
    depends_on:
      kafka:
        condition: service_started
      payment-db:
        condition: service_healthy
    networks:
      - orchestrator-saga
    environment:
      - KAFKA_BROKER=kafka:29092
      - DB_HOST=payment-db
      - DB_PORT=5432
      - DB_NAME=payment-db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    ports:
      - "8091:8091"

  inventory-service:
    container_name: inventory-service
    build: '../inventory-service'
    depends_on:
      kafka:
        condition: service_started
      inventory-db:
        condition: service_healthy
    networks:
      - orchestrator-saga
    environment:
      - KAFKA_BROKER=kafka:29092
      - DB_HOST=inventory-db
      - DB_PORT=5432
      - DB_NAME=inventory-db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    ports:
      - "8092:8092"

  order-lb:
    image: nginx:alpine
    container_name: order-lb
    depends_on:
      - order-service
    networks:
      - orchestrator-saga
    ports:
      - "3000:80"     # o host continua acessando em localhost:3000, agora via LB
    volumes:
      - ./loadbalance/nginx.conf:/etc/nginx/nginx.conf:ro
        
  # 1. OPENTELEMETRY COLLECTOR (O receptor central da sua aplicação)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # Porta gRPC OTLP (Traces)
      - "4318:4318" # Porta HTTP OTLP (Métricas/Logs)
    networks:
      - orchestrator-saga

  # 2. GRAFANA TEMPO (Armazenamento de Traces da SAGA)
  grafana-tempo:
    image: grafana/tempo:latest
    container_name: grafana-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200" # Tempo API
    networks:
      - orchestrator-saga

  # 3. GRAFANA LOKI (Armazenamento dos Logs Estruturados)
  grafana-loki:
    image: grafana/loki:latest
    container_name: grafana-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    networks:
      - orchestrator-saga

  # 4. PROMETHEUS ou GRAFANA MIMIR (Armazenamento de Métricas)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
    ports:
      - "9090:9090"
    networks:
      - orchestrator-saga

  # 5. GRAFANA (Painel de Visualização Unificado)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3300:3000" # Acesse http://localhost:3300
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    networks:
      - orchestrator-saga
    depends_on:
      - grafana-loki
      - grafana-tempo
      - prometheus  

networks:
  orchestrator-saga:
    driver: bridge