events {}

http {
    # DNS interno do Docker — re-resolve o nome do serviço para pegar as réplicas
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ecoa o Origin recebido (necessário quando se usa credenciais; "*" não pode com credentials)
    map $http_origin $cors_origin {
        default "";
        "~.*"   $http_origin;
    }

    server {
        listen 80;

        location / {

            # ---- Preflight (OPTIONS): responde direto, sem ir ao backend ----
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $cors_origin always;
                add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers     "Content-Type, Authorization" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age           86400 always;
                add_header Content-Length 0;
                add_header Content-Type "text/plain";
                return 204;
            }

            # ---- Respostas normais: adiciona o header de CORS ----
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;

            # usar variável força o Nginx a resolver via DNS a cada request,
            # distribuindo entre os IPs das réplicas do order-service
            set $backend "order-service";
            proxy_pass http://$backend:3000;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
        }
    }
}