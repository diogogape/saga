spring.application.name=payment-service
server.port=8091

spring.kafka.bootstrap-servers=${KAFKA_BROKER:localhost:9092}
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=latest

kafka.topic.payment-success=payment-success
kafka.topic.payment-fail=payment-fail
kafka.topic.orchestrator=orchestrator
logging.level.org.apache.kafka=OFF


spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:payment-db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop